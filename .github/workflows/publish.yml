name: Publish Claude plugin

on:
  push:
    tags: ["claude-v*"]

permissions: {}

concurrency:
  group: claude-plugin-npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Verify tag and source commit
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "firstdraft/skills"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_PROTECTED" = "true"
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          event_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$release_sha" = "$event_sha"
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${GITHUB_REF_NAME}:refs/release-check/tag" \
            "+refs/tags/claude-v*:refs/release-check/tags/claude-v*"
          test "$release_sha" = "$(git rev-parse 'refs/release-check/tag^{commit}')"
          package_version="$(node --print 'JSON.parse(require("node:fs").readFileSync("packages/claude-plugin/package.template.json", "utf8")).version')"
          test "$GITHUB_REF_NAME" = "claude-v$package_version"
          git rev-list --first-parent refs/remotes/origin/main > "$RUNNER_TEMP/main-first-parent"
          grep -Fqx "$release_sha" "$RUNNER_TEMP/main-first-parent"
      - name: Reuse successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          ci_url="$(gh run list --workflow ci.yml --branch main --event push --commit "$release_sha" --status success --limit 1 --json url --jq '.[0].url // empty')"
          test -n "$ci_url" || { echo "No successful main CI run for $release_sha" >&2; exit 1; }
          echo "Reusing $ci_url"
      - run: node script/check-plugin-release-order.mjs

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Verify approved release
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          test "$NPM_RELEASE_ENABLED" = "true"
          test "$GITHUB_REPOSITORY" = "firstdraft/skills"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_PROTECTED" = "true"
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          event_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$release_sha" = "$event_sha"
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${GITHUB_REF_NAME}:refs/release-check/tag" \
            "+refs/tags/claude-v*:refs/release-check/tags/claude-v*"
          test "$release_sha" = "$(git rev-parse 'refs/release-check/tag^{commit}')"
          package_version="$(node --print 'JSON.parse(require("node:fs").readFileSync("packages/claude-plugin/package.template.json", "utf8")).version')"
          test "$GITHUB_REF_NAME" = "claude-v$package_version"
          git rev-list --first-parent refs/remotes/origin/main > "$RUNNER_TEMP/main-first-parent"
          grep -Fqx "$release_sha" "$RUNNER_TEMP/main-first-parent"
      - run: node script/check-plugin-release-order.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: firstdraft/cli
          ref: main
          fetch-depth: 0
          path: tmp/firstdraft-cli
          persist-credentials: false
      - name: Select the pinned CLI
        run: |
          cli_revision="$(node --input-type=module -e 'import { cliRevision } from "./script/cli-contract/config.mjs"; console.log(cliRevision)')"
          git -C tmp/firstdraft-cli merge-base --is-ancestor "$cli_revision" HEAD
          git -C tmp/firstdraft-cli checkout --detach "$cli_revision"
      - run: node script/check-cli-registry-package.mjs --cli-root tmp/firstdraft-cli
      - run: node script/claude-plugin-package.mjs pack "$RUNNER_TEMP/plugin" --cli-root tmp/firstdraft-cli
      - name: Verify publication bytes
        run: |
          set -euo pipefail
          package_version="${GITHUB_REF_NAME#claude-v}"
          tarball="$RUNNER_TEMP/plugin/firstdraft.com-claude-code-$package_version.tgz"
          expected="$(node --print 'JSON.parse(require("node:fs").readFileSync("release/compatibility.json", "utf8")).plugin_source.tarball_sha256')"
          actual="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Publish verified package with OIDC
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          npm publish "$RUNNER_TEMP/plugin/firstdraft.com-claude-code-${GITHUB_REF_NAME#claude-v}.tgz" --access public --tag latest --provenance --ignore-scripts
