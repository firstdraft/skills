name: Promote npm defaults

on:
  push:
    tags: ["promote-v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: claude-plugin-npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify published packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify release toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - run: node script/npm-promotion.mjs inspect

  promote:
    name: Promote or check npm access
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-promotion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Verify release toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - name: Promote the qualified pair
        if: github.event_name == 'push'
        run: node script/npm-promotion.mjs promote
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROMOTION_TOKEN }}
      - name: Check token with temporary tags
        if: github.event_name == 'workflow_dispatch'
        run: node script/npm-promotion.mjs verify-token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PROMOTION_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: npm-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-promotion/receipt.json
          if-no-files-found: ignore
