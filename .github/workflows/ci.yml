name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22.0.0, 24.18.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify release toolchain
        if: matrix.node == '24.18.0'
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
      - run: npm ci --ignore-scripts
      - run: sh script/check
      - name: Rehearse release ordering
        if: matrix.node == '24.18.0'
        run: |
          git fetch --force --no-tags origin \
            "+refs/tags/claude-v*:refs/release-check/tags/claude-v*"
          node script/check-plugin-release-order.mjs --prospective
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: firstdraft/cli
          ref: main
          fetch-depth: 0
          path: tmp/firstdraft-cli
          persist-credentials: false
      - run: git -C tmp/firstdraft-cli merge-base --is-ancestor d38ef3e54a6476b3a91f22a17fe7bd47aa6d6d68 HEAD
      - run: git -C tmp/firstdraft-cli checkout --detach d38ef3e54a6476b3a91f22a17fe7bd47aa6d6d68
      - run: node script/check-cli-contract.mjs tmp/firstdraft-cli
      - run: node script/check-claude-plugin-package.mjs --cli-root tmp/firstdraft-cli
